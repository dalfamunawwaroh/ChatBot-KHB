<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15803D">
  <title>Reset Kata Sandi · KHB Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css"></head>
<body>
<div class="auth-pages" id="auth-pages">
<div class="auth-page active" id="page-reset">
      <div class="auth-centered">
        <div class="auth-card">
          <div class="auth-card-logo">
            <div class="auth-logo small">
              <svg viewBox="0 0 44 44" fill="none" aria-hidden="true">
                <path d="M22 4 36 9.5v11C36 29.8 30 35.3 22 38.8 14 35.3 8 29.8 8 20.5v-11L22 4Z" fill="currentColor" opacity=".18"/>
                <path d="m13.5 22 5.2 5.1 11-11" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="auth-card-icon-wrap">
            <div class="auth-card-icon">
              <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" fill="var(--green-subtle)"/><path d="M18 24l4.5 4.5L30 19" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <div><span class="auth-badge"><i></i>KATA SANDI BARU</span></div>
          <h1>Reset Kata Sandi</h1>
          <p class="auth-card-desc">Buat kata sandi baru yang kuat untuk akun Anda.</p>
          <form class="auth-form" id="reset-form" novalidate>
            <div class="form-group">
              <label for="reset-password">Kata Sandi Baru</label>
              <div class="input-wrap">
                <span class="input-icon"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="9" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
                <input type="password" id="reset-password" placeholder="Min. 8 karakter" required>
                <button type="button" class="input-toggle-pw" data-target="reset-password" aria-label="Tampilkan">
                  <svg viewBox="0 0 20 20" fill="none"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="reset-confirm">Konfirmasi Kata Sandi</label>
              <div class="input-wrap">
                <span class="input-icon"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="9" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
                <input type="password" id="reset-confirm" placeholder="Ulangi kata sandi baru" required>
                <button type="button" class="input-toggle-pw" data-target="reset-confirm" aria-label="Tampilkan">
                  <svg viewBox="0 0 20 20" fill="none"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="btn-auth">
              <span class="btn-text">Simpan Kata Sandi Baru</span>
              <span class="btn-loader hidden"></span>
            </button>
          </form>
        </div>
      </div>
    </div>

</div><!-- /auth-pages -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
